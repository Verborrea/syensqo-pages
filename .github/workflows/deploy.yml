name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Compute site URL and base path
        id: site
        run: |
          if [ -f public/CNAME ]; then
            # A custom domain (see public/CNAME) serves the site from its
            # own root, regardless of the repo name.
            DOMAIN=$(tr -d '[:space:]' < public/CNAME)
            echo "site=https://$DOMAIN" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            REPO_NAME="${{ github.event.repository.name }}"
            OWNER="${{ github.repository_owner }}"
            echo "site=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"
            if [[ "$REPO_NAME" == "$OWNER.github.io" ]]; then
              echo "base=/" >> "$GITHUB_OUTPUT"
            else
              echo "base=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          SITE_URL: ${{ steps.site.outputs.site }}
          BASE_PATH: ${{ steps.site.outputs.base }}
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
